name: Test WARP egress
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: IP before WARP
        run: |
          echo "public IP (no warp):"
          curl -s https://ifconfig.me
          echo ""
          echo "OLX API without WARP:"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" "https://www.olx.pt/api/v1/offers/?category_id=378&limit=40&offset=0&sort_by=created_at%3Adesc&currency=EUR"

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          sudo warp-svc &
          sleep 5
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: IP and OLX check after WARP
        run: |
          echo "public IP (with warp):"
          curl -s https://ifconfig.me
          echo ""
          echo "OLX API with WARP:"
          curl -s -o /tmp/body.txt -w "HTTP %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" "https://www.olx.pt/api/v1/offers/?category_id=378&limit=40&offset=0&sort_by=created_at%3Adesc&currency=EUR"
          echo "--- body head ---"
          head -c 300 /tmp/body.txt
