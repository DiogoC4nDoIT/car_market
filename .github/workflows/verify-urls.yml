name: Verify OLX ad URLs

on:
  schedule:
    - cron: "15 */4 * * *"   # re-check a batch of stored ad urls every 4 hours
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser transport serializes requests (single Chrome page), so a
    # full batch takes longer than the old concurrent direct fetches.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # OLX's WAF blocks plain HTTP clients from datacenter IPs; requests are
      # routed through headless Chrome instead (OLX_BROWSER=1).
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Verify ad URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          OLX_BROWSER: "1"
        run: python -m src.url_checker
