name: Verify OLX ad URLs

on:
  schedule:
    - cron: "15 */8 * * *"   # re-check a batch of stored ad urls three times a day
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Override URL_CHECK_DELAY_SECONDS (rate-limit probing only — leave blank for the production default)"
        type: string
        default: ""
      concurrency:
        description: "Override URL_CHECK_CONCURRENCY (leave blank for the production default)"
        type: string
        default: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser transport now runs a small pool of pages concurrently
    # (matching URL_CHECK_CONCURRENCY) instead of one page fully serial, but
    # still leave headroom for a slow WAF day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      # url_checker never imports pandas/streamlit — those are dashboard-only
      # (verified: no src/ file references either), so installing the full
      # requirements.txt here just pays for dozens of unused transitive deps
      # (pyarrow, altair, tornado, ...) on every single run.
      - run: pip install -r requirements-crawler.txt
      # OLX's WAF blocks plain HTTP clients from datacenter IPs; requests are
      # routed through headless Chrome instead (OLX_BROWSER=1). The browser
      # binary is cached across runs — it doesn't change often, and
      # downloading/extracting it fresh every run burns 1-2 min of billed
      # Actions time for nothing.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-crawler.txt') }}
      # `--with-deps` (apt-installing ~20 system libraries) is unnecessary here:
      # verified 2026-09-26 that ubuntu-latest already ships everything Chromium
      # needs — a run with zero apt install ever run still launched the browser
      # fine ("browser transport ready"). Dropping it saves ~15-20s on every run.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
      - name: Verify ad URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          OLX_BROWSER: "1"
          URL_CHECK_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          URL_CHECK_CONCURRENCY: ${{ inputs.concurrency }}
        run: python -m src.url_checker
