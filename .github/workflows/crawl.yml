name: Crawl OLX.pt

on:
  schedule:
    - cron: "0 * * * *"      # incremental crawl every hour
    - cron: "0 3 * * 0"      # weekly deep sweep (Sunday 03:00 UTC)
    - cron: "0 8 * * *"      # daily Telegram digest (08:00 UTC)
  workflow_dispatch:
    inputs:
      deep_sweep:
        description: "Run full price-bucketed sweep"
        type: boolean
        default: false
      skip_install_deps:
        description: "TEST ONLY: skip 'playwright install-deps' to check if ubuntu-latest already has the needed libs"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      # Crawler/digest never import pandas/streamlit — those are dashboard-only
      # (verified: no src/ file references either), so installing the full
      # requirements.txt here just pays for dozens of unused transitive deps
      # (pyarrow, altair, tornado, ...) on every single run.
      - run: pip install -r requirements-crawler.txt
      # The daily digest (08:00 UTC) only reads Supabase and sends a Telegram
      # message — it never touches OLX, so it doesn't need a browser at all.
      # Only install one for the crawl/deep-sweep runs, and cache the browser
      # binary across those — it doesn't change often, and downloading it
      # fresh every run burns 1-2 min of billed Actions time for nothing.
      - if: github.event.schedule != '0 8 * * *'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-crawler.txt') }}
      - if: github.event.schedule != '0 8 * * *' && steps.playwright-cache.outputs.cache-hit != 'true' && !inputs.skip_install_deps
        run: playwright install --with-deps chromium
      - if: github.event.schedule != '0 8 * * *' && steps.playwright-cache.outputs.cache-hit != 'true' && inputs.skip_install_deps
        run: playwright install chromium
      - if: github.event.schedule != '0 8 * * *' && steps.playwright-cache.outputs.cache-hit == 'true' && !inputs.skip_install_deps
        run: playwright install-deps chromium
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          OLX_BROWSER: "1"
          DEEP_SWEEP: ${{ (github.event.schedule == '0 3 * * 0' || inputs.deep_sweep) && '1' || '0' }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            python -m src.digest
          else
            python -m src.crawler
          fi
