name: Crawl OLX.pt

on:
  schedule:
    - cron: "0 * * * *"      # incremental crawl every hour
    - cron: "0 3 * * 0"      # weekly deep sweep (Sunday 03:00 UTC)
    - cron: "0 8 * * *"      # daily Telegram digest (08:00 UTC)
  workflow_dispatch:
    inputs:
      deep_sweep:
        description: "Run full price-bucketed sweep"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # OLX's WAF blocks plain HTTP clients from datacenter IPs; the crawler
      # routes requests through headless Chrome instead (OLX_BROWSER=1).
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          OLX_BROWSER: "1"
          DEEP_SWEEP: ${{ (github.event.schedule == '0 3 * * 0' || inputs.deep_sweep) && '1' || '0' }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            python -m src.digest
          else
            python -m src.crawler
          fi
