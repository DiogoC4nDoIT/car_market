name: Crawl OLX.pt

on:
  schedule:
    - cron: "*/30 * * * *"   # incremental crawl every 30 min
    - cron: "0 3 * * 0"      # weekly deep sweep (Sunday 03:00 UTC)
  workflow_dispatch:
    inputs:
      deep_sweep:
        description: "Run full price-bucketed sweep"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEP_SWEEP: ${{ (github.event.schedule == '0 3 * * 0' || inputs.deep_sweep) && '1' || '0' }}
        run: python -m src.crawler
