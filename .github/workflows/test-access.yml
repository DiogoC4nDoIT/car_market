name: Diagnose OLX access paths
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: curl matrix
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe() {
            echo "===== $1"
            curl -s -o /tmp/b -w "HTTP %{http_code} size=%{size_download}\n" -A "$UA" -H "Accept-Language: pt-PT,pt;q=0.9" "$2" --max-time 25 || echo "curl failed"
            head -c 200 /tmp/b; echo; echo
          }
          probe "category HTML page" "https://www.olx.pt/carros-motos-e-barcos/carros/"
          probe "sitemap" "https://www.olx.pt/sitemap.xml"
          probe "api plain" "https://www.olx.pt/api/v1/offers/?category_id=378&limit=5&offset=0"

          echo "===== api with cookies + full browser headers"
          curl -s -c /tmp/cj -o /dev/null -A "$UA" "https://www.olx.pt/carros-motos-e-barcos/carros/" --max-time 25 || true
          curl -s -b /tmp/cj -o /tmp/b -w "HTTP %{http_code}\n" \
            "https://www.olx.pt/api/v1/offers/?category_id=378&limit=5&offset=0" \
            -A "$UA" -H "Accept: application/json" \
            -H "Referer: https://www.olx.pt/carros-motos-e-barcos/carros/" \
            -H 'sec-ch-ua: "Chromium";v="126", "Google Chrome";v="126", "Not.A/Brand";v="24"' \
            -H 'sec-ch-ua-mobile: ?0' -H 'sec-ch-ua-platform: "Windows"' \
            -H 'sec-fetch-site: same-origin' -H 'sec-fetch-mode: cors' -H 'sec-fetch-dest: empty' \
            --max-time 25 || echo "curl failed"
          head -c 200 /tmp/b; echo

          echo "===== standvirtual homepage (plan-B data source signal)"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" "https://www.standvirtual.com/" --max-time 25 || echo "curl failed"

      - name: Playwright real-browser probe
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python - <<'EOF'
          import json
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              b = p.chromium.launch(args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  locale="pt-PT",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              )
              page = ctx.new_page()
              resp = page.goto("https://www.olx.pt/carros-motos-e-barcos/carros/",
                               wait_until="domcontentloaded", timeout=45000)
              print("page status:", resp.status if resp else None)
              print("title:", page.title()[:100])
              body_head = page.content()[:300].replace("\n", " ")
              print("body head:", body_head)
              try:
                  r = page.evaluate("""async () => {
                      const res = await fetch('/api/v1/offers/?category_id=378&limit=5&offset=0',
                                              {headers: {'Accept': 'application/json'}});
                      const t = await res.text();
                      return {status: res.status, head: t.slice(0, 200)};
                  }""")
                  print("api via browser:", json.dumps(r)[:400])
              except Exception as e:
                  print("api via browser failed:", e)
              b.close()
          EOF
